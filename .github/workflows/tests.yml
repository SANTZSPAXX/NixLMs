name: NixLMs tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feature/**", "test/**"]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  episodic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic episodic benchmark
        run: python benchmarks/episodic_retrieval.py --sizes 100 500 2000 --repeats 5 > episodic-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: episodic-retrieval-benchmark
          path: episodic-benchmark.json
          if-no-files-found: error
          retention-days: 14
  episodic-quality-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PT-BR episodic retrieval quality baseline
        run: python benchmarks/episodic_retrieval_quality_ptbr.py > episodic-retrieval-quality-ptbr.json
      - uses: actions/upload-artifact@v4
        with:
          name: episodic-retrieval-quality-ptbr
          path: episodic-retrieval-quality-ptbr.json
          if-no-files-found: error
          retention-days: 14
