services:
  - type: web
    name: nixlms-cloud
    runtime: python
    plan: free
    region: virginia
    branch: feature/render-cloud-runtime
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m nixlms_web.server
    healthCheckPath: /api/health
    envVars:
      - key: RENDER
        value: "true"
      - key: NIXLMS_DATA_DIR
        value: /var/data
      - key: NIXLMS_AUTO_INSTALL_MEDIA
        value: "0"
      - key: NIXLMS_REQUIRE_SUPABASE
        value: "1"
      - key: NIXLMS_SUPABASE_SYNC_SECONDS
        value: "10"
      - key: NIXLMS_DATABASE_URL
        sync: false
      - key: NIXLMS_ACCESS_TOKEN
        sync: false
